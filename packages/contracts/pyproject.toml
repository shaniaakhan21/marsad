[project]
name = "marsad-contracts"
version = "0.1.0"
description = "MARSAD boundary contract — the single source of truth for what may cross the privacy boundary"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["marsad_contracts*"]
