# The boundary gateway with mutual TLS on, for every deployment that is not one laptop.
#
# The same three routes as boundary-gateway.conf. The difference is that a connector must now
# prove who it is: a certificate signed by the federation CA, or the handshake fails
# before any HTTP exists. The verified subject is passed to the core, which binds it to
# the institution_ref in the payload.
server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate         /etc/nginx/certs/core.crt;
    ssl_certificate_key     /etc/nginx/certs/core.key;
    ssl_client_certificate  /etc/nginx/certs/ca.crt;
    ssl_verify_client on;
    ssl_protocols           TLSv1.2 TLSv1.3;

    location = /v1/submissions {
        limit_except POST {
            deny all;
        }
        proxy_pass http://core:8000/v1/submissions;
        proxy_set_header Host $host;
        # Set from the verified handshake, replacing anything the client sent.
        proxy_set_header X-Client-Cert-Subject $ssl_client_s_dn;
        proxy_read_timeout 30s;
    }

    # Provider declarations: tokens and closed vocabularies, built and recorded like a
    # submission. The second of the two routes that accept data from a firm.
    location = /v1/declarations {
        limit_except POST {
            deny all;
        }
        proxy_pass http://core:8000/v1/declarations;
        proxy_set_header Host $host;
        proxy_set_header X-Client-Cert-Subject $ssl_client_s_dn;
        proxy_read_timeout 30s;
    }

    # A firm collecting its own rung-0 notices. Read-only: the one thing that travels
    # inward. It accepts nothing.
    location = /v1/notices {
        limit_except GET {
            deny all;
        }
        proxy_pass http://core:8000/v1/notices;
        proxy_set_header Host $host;
        proxy_set_header X-Client-Cert-Subject $ssl_client_s_dn;
        proxy_read_timeout 30s;
    }

    location / {
        default_type application/json;
        return 403 '{"error":"boundary: only submissions, declarations and notices cross from an edge network"}';
    }
}
