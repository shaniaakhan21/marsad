# The route from an edge network to the key custodians.
#
# Deliberately separate from the boundary gateway: the custodians share no network with
# the core, so the party that sees tokens and the parties that help make them cannot
# reach each other. One path per custodian, POST evaluate only.
server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate         /etc/nginx/certs/core.crt;
    ssl_certificate_key     /etc/nginx/certs/core.key;
    ssl_client_certificate  /etc/nginx/certs/ca.crt;
    ssl_verify_client on;
    ssl_protocols           TLSv1.2 TLSv1.3;

    location ~ ^/c([123])/v1/oprf/evaluate$ {
        limit_except POST {
            deny all;
        }
        resolver 127.0.0.11 valid=10s;
        set $custodian evaluator-$1;
        proxy_pass http://$custodian:8000/v1/oprf/evaluate;
        # From the verified handshake, replacing anything the client sent.
        proxy_set_header X-Client-Cert-Subject $ssl_client_s_dn;
    }

    location / {
        default_type application/json;
        return 403 '{"error":"oprf gateway: only POST evaluate is forwarded"}';
    }
}
