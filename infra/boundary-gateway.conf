# The single route from an edge network to core_net.
#
# Docker networking does the isolation: a connector sits on its own edge network and
# has no route to core at all, so it cannot address core directly by any name or
# address. This gateway is the one container bridging an edge network to core_net,
# which makes it the only path — and it forwards exactly one endpoint.
#
# Read the two controls separately, because they are not the same strength:
#   * "a connector cannot reach core"      — enforced by Docker, at the network layer
#   * "only the submission endpoint works" — enforced here, by this config
# The tests assert the first at the network layer and the second at this gateway.

server {
    listen 8000;
    server_name _;

    # Tokenised boundary payloads. Nothing else from an edge network reaches core.
    location = /v1/submissions {
        limit_except POST {
            deny all;
        }
        proxy_pass http://core:8000/v1/submissions;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # Everything else is refused here rather than forwarded. A connector asking for
    # /v1/correlations, /health or any read endpoint is asking for something it has
    # no business seeing from inside an institution's perimeter.
    location / {
        default_type application/json;
        return 403 '{"error":"boundary: only POST /v1/submissions crosses from an edge network"}';
    }
}
