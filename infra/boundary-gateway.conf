# The single route from an edge network to core_net.
#
# Docker networking does the isolation: a connector sits on its own edge network and
# has no route to core at all, so it cannot address core directly by any name or
# address. This gateway is the one container bridging an edge network to core_net,
# which makes it the only path — and it forwards exactly three routes. POST /v1/submissions
# and POST /v1/declarations are the only ways anything leaves a firm, and each carries only
# a typed payload A3 built. GET /v1/notices brings a firm its own notices and accepts nothing.
#
# Read the two controls separately, because they are not the same strength:
#   * "a connector cannot reach core"      — enforced by Docker, at the network layer
#   * "only these three routes work"       — enforced here, by this config
# The tests assert the first at the network layer and the second at this gateway.

server {
    listen 8000;
    server_name _;

    # Tokenised incident payloads.
    location = /v1/submissions {
        limit_except POST {
            deny all;
        }
        proxy_pass http://core:8000/v1/submissions;
        proxy_set_header Host $host;
        # This route has no certificate to vouch for anyone, so the identity header is
        # always cleared. A connector that set it for itself must not be believed.
        proxy_set_header X-Client-Cert-Subject "";
        proxy_read_timeout 30s;
    }

    # Provider declarations: tokens and closed vocabularies, built and recorded like a
    # submission. The second of the two routes that accept data from a firm.
    location = /v1/declarations {
        limit_except POST {
            deny all;
        }
        proxy_pass http://core:8000/v1/declarations;
        proxy_set_header Host $host;
        proxy_set_header X-Client-Cert-Subject "";
        proxy_read_timeout 30s;
    }

    # A firm collecting its own rung-0 notices. Read-only: the one thing that travels
    # inward. It accepts nothing.
    location = /v1/notices {
        limit_except GET {
            deny all;
        }
        proxy_pass http://core:8000/v1/notices;
        proxy_set_header Host $host;
        proxy_set_header X-Client-Cert-Subject "";
        proxy_read_timeout 30s;
    }

    # Everything else is refused here rather than forwarded. A connector asking for
    # /v1/correlations, /health or any read endpoint is asking for something it has
    # no business seeing from inside an institution's perimeter.
    location / {
        default_type application/json;
        return 403 '{"error":"boundary: only submissions, declarations and notices cross from an edge network"}';
    }
}
