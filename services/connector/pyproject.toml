[project]
name = "marsad-connector"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6",
  "pydantic-settings>=2.2", "httpx>=0.27", "sqlalchemy>=2.0",
  "aiosqlite>=0.20", "marsad-contracts",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
