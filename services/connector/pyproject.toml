[project]
name = "marsad-connector"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6",
  "pydantic-settings>=2.2", "httpx>=0.27", "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1", "alembic>=1.13", "marsad-contracts",
]

[project.optional-dependencies]
# camel-tools is the ORACLE the vendored Arabic normalisation is tested against, not a
# runtime dependency. It pulls torch, transformers and the CUDA runtime; shipping that
# inside an institution's perimeter for four character maps is the thing vendoring
# exists to avoid. See lang/arabic.py and tests/test_vendored_normalisation.py.
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "camel-tools>=1.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
